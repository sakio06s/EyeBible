name: Update daily scripture

on:
  schedule:
    # UTC 16:05/16:35/20:05 = Asia/Taipei 00:05/00:35/04:05.
    - cron: '5,35 16 * * *'
    - cron: '5 20 * * *'
    # Retry away from the busy top of the hour if an earlier schedule was missed.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify current sources without publishing data'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-scripture.yml'
      - 'scripts/update_daily.py'
  pull_request:
    paths:
      - '.github/workflows/daily-scripture.yml'
      - 'scripts/update_daily.py'
      - 'tests/test_*.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test importer validation and failure handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  verify-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Resolve today's progress and verses without publishing
        run: python3 scripts/update_daily.py --output "$RUNNER_TEMP/tagbible-source-check"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.verify_only
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: daily-scripture-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Check whether today's reading still needs publishing
        id: daily
        shell: bash
        run: |
          reading_date=$(TZ=Asia/Taipei date +%F)
          if [[ "${{ github.event_name }}" == 'schedule' && -s "data/daily/$reading_date.json" ]]; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            echo "Reading for $reading_date is already published."
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch and validate today's reference and public-domain scripture
        if: steps.daily.outputs.needed == 'true'
        run: python3 scripts/update_daily.py
      - name: Publish validated data atomically through one commit
        if: steps.daily.outputs.needed == 'true'
        shell: bash
        run: |
          git add data/daily data/latest.json data/sync-status.json
          if git diff --cached --quiet; then
            echo 'Daily scripture is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated daily scripture'
          git pull --rebase origin main
          git push origin HEAD:main
