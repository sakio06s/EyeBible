name: Update daily scripture

on:
  schedule:
    # UTC 16:05/16:35/20:05 = Asia/Taipei 00:05/00:35/04:05.
    - cron: '5,35 16 * * *'
    - cron: '5 20 * * *'
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Verify current sources without publishing data'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-scripture.yml'
      - 'scripts/update_daily.py'
  pull_request:
    paths:
      - '.github/workflows/daily-scripture.yml'
      - 'scripts/update_daily.py'
      - 'tests/test_*.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test importer validation and failure handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  verify-sources:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_only
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Inspect fixed public backup feed metadata
        run: |
          python3 - <<'PYFEED'
          import importlib.util, xml.etree.ElementTree as ET
          spec=importlib.util.spec_from_file_location('daily','scripts/update_daily.py')
          m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          root=ET.fromstring(m.download(m.YOUTUBE_FEED))
          print('Feed root:',root.tag)
          print('Channel identity:',[(e.tag,e.text) for e in root if 'channelId' in e.tag or e.tag.endswith('}title')])
          ns={'a':'http://www.w3.org/2005/Atom','media':'http://search.yahoo.com/mrss/'}
          for entry in root.findall('a:entry',ns)[:5]:
              print('Video title:',entry.findtext('a:title',namespaces=ns))
              print('Entry identity:',[(e.tag,e.text) for e in entry if 'channelId' in e.tag])
              print('Description prefix:',entry.findtext('media:group/media:description',default='',namespaces=ns)[:450])
          PYFEED
      - name: Resolve today's progress and verses without publishing
        run: python3 scripts/update_daily.py --output "$RUNNER_TEMP/tagbible-source-check"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && !inputs.verify_only
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: daily-scripture-publish
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0
      - name: Fetch and validate today's reference and public-domain scripture
        run: python3 scripts/update_daily.py
      - name: Publish validated data atomically through one commit
        shell: bash
        run: |
          git add data/daily data/latest.json data/sync-status.json
          if git diff --cached --quiet; then
            echo 'Daily scripture is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update validated daily scripture'
          git pull --rebase origin main
          git push origin HEAD:main
